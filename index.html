<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <title>Happy Birthday Bidusmita 🎂</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
:root {
        --rose: #f4b8a6;
        --gold: #f7d794;
        --pink: #ff6fa8;
        --teal: #27d3c0;
        --glass: rgba(255,255,255,.09);
        --line: rgba(255,255,255,.22);
        --ease: cubic-bezier(.22,1,.36,1);
        color-scheme: dark
    }
        * {
            box-sizing: border-box;
            margin: 0;
            -webkit-tap-highlight-color: transparent
        }
        html {
            scroll-behavior: smooth
        }
        body {
            font-family: 'Poppins',system-ui,sans-serif;
            color: #fff8f3;
            background: #0b0820;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased
        }
        button {
            font: inherit
        }
        .aurora {
            position: absolute;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0
        }
        .aurora i {
            position: absolute;
            width: 70vmax;
            height: 70vmax;
            border-radius: 50%;
            will-change: transform;
            animation: aur 22s ease-in-out infinite alternate
        }
        .aurora i:nth-child(1) {
            left: -45vmax;
            top: -40vmax;
            background: radial-gradient(circle,rgba(123,63,228,.65),transparent 62%)
        }
        .aurora i:nth-child(2) {
            right: -50vmax;
            top: 10vh;
            background: radial-gradient(circle,rgba(39,211,192,.38),transparent 62%);
            animation-delay: -8s
        }
        .aurora i:nth-child(3) {
            left: -20vmax;
            bottom: -55vmax;
            background: radial-gradient(circle,rgba(255,111,168,.45),transparent 62%);
            animation-delay: -14s
        }
        @keyframes aur {
            to {
                transform: translate3d(14vw,8vh,0) scale(1.15)
            }
        }
        .stars {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none
        }
        .stars b {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            animation: tw 4s ease-in-out infinite;
            will-change: opacity
        }
        @keyframes tw {
            50% {
                opacity: .15
            }
        }
        #fx {
            position: fixed;
            inset: 0;
            z-index: 80;
            pointer-events: none
        }
        .page {
            position: relative;
            min-height: 100vh;
            overflow: hidden
        }
        #p1 {
            z-index: 2
        }
        #p2 {
            display: none;
            position: absolute;
            left: 0;
            right: 0;
            top: 0;
            z-index: 3;
            background: radial-gradient(circle at 20% 0%,#3a1a6e,transparent 55%),radial-gradient(circle at 90% 40%,#0f5a64,transparent 50%),radial-gradient(circle at 10% 90%,#6b1b52,transparent 55%),#0d0a24
        }
        .sky {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            overflow: hidden
        }
        .top {
            position: absolute;
            top: calc(env(safe-area-inset-top,0px) + 12px);
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            z-index: 10;
            padding: 0 10px
        }
        .pill {
            border: 1px solid var(--line);
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            font-size: 13px;
            font-weight: 500;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform .5s var(--ease),background .4s
        }
        .pill:active {
            transform: scale(.94)
        }
        .pill:hover {
            background: rgba(255,255,255,.18);
            transform: translateY(-2px)
        }
        .cta {
            position: relative;
            border: 0;
            color: #2a1030;
            font-weight: 600;
            font-size: 15px;
            padding: 15px 30px;
            border-radius: 60px 40px 60px 44px;
            cursor: pointer;
            background: linear-gradient(110deg,var(--gold),var(--rose),#ffb3d1,var(--gold));
            background-size: 300% 100%;
            animation: sh 7s linear infinite;
            box-shadow: 0 12px 30px rgba(244,184,166,.35),inset 0 2px 6px rgba(255,255,255,.7);
            transition: transform .6s var(--ease),border-radius .8s var(--ease)
        }
        .cta:hover {
            transform: translateY(-3px) scale(1.04);
            border-radius: 44px 60px 44px 60px
        }
        .cta:active {
            transform: scale(.95)
        }
        @keyframes sh {
            to {
                background-position: 300% 0
            }
        }
        .stage {
            position: relative;
            z-index: 3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 80px 16px 40px
        }
        .ttl {
            font-family: 'Playfair Display',Georgia,serif;
            font-style: italic;
            font-size: clamp(30px,9vw,60px);
            line-height: 1.2;
            background: linear-gradient(100deg,#fff,var(--gold),var(--rose),#fff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: sh 8s linear infinite
        }
        .ttl small {
            display: block;
            font-family: 'Poppins',sans-serif;
            font-style: normal;
            font-size: 12px;
            letter-spacing: .45em;
            text-transform: uppercase;
            color: var(--gold);
            -webkit-text-fill-color: var(--gold);
            margin-bottom: 8px
        }
        .nm span {
            display: inline-block;
            animation: wv 3s ease-in-out infinite;
            will-change: transform
        }
        @keyframes wv {
            50% {
                transform: translateY(-9px)
            }
        }
        .hint {
            margin-top: 26px;
            font-size: 14px;
            color: var(--gold);
            animation: pl 2s ease-in-out infinite
        }
        @keyframes pl {
            50% {
                opacity: .45;
                transform: scale(1.05)
            }
        }

        /* cake */
        .cake {
            position: relative;
            width: 280px;
            margin-top: 30px;
            cursor: pointer;
            animation: fl 5s ease-in-out infinite;
            filter: drop-shadow(0 28px 26px rgba(0,0,0,.55));
            will-change: transform
        }
        @keyframes fl {
            50% {
                transform: translateY(-10px)
            }
        }
        .cake:after {
            content: "";
            position: absolute;
            left: 10%;
            right: 10%;
            bottom: -24px;
            height: 16px;
            border-radius: 50%;
            background: rgba(0,0,0,.45);
            filter: blur(10px);
            z-index: -1
        }
        .candles {
            display: flex;
            justify-content: center;
            gap: 20px;
            align-items: flex-end;
            height: 78px;
            position: relative;
            z-index: 4
        }
        .candle {
            position: relative;
            width: 10px;
            height: 44px;
            border-radius: 3px;
            background: linear-gradient(90deg,#c99a3a,#ffe9a8 45%,#c99a3a);
            box-shadow: inset -2px 0 3px rgba(0,0,0,.25)
        }
        .candle:before {
            content: "";
            position: absolute;
            top: -5px;
            left: 50%;
            width: 2px;
            height: 6px;
            background: #1a1a1a;
            transform: translateX(-50%)
        }
        .flame {
            position: absolute;
            left: 50%;
            bottom: 44px;
            width: 15px;
            height: 28px;
            margin-left: -7.5px;
            border-radius: 50% 50% 50% 50%/62% 62% 38% 38%;
            background: radial-gradient(circle at 50% 75%,#fff 0,#fff3b0 25%,#ffb21c 60%,#ff6a00 85%,transparent 90%);
            box-shadow: 0 0 22px 8px rgba(255,170,40,.6),0 0 70px 24px rgba(255,120,0,.28);
            transform-origin: 50% 100%;
            animation: fk .3s ease-in-out infinite alternate;
            transition: opacity .5s,transform .5s
        }
        @keyframes fk {
            from {
                transform: scale(1,1) skewX(-4deg)
            }
            to {
                transform: scale(.88,1.12) skewX(5deg)
            }
        }
        .out .flame {
            opacity: 0;
            transform: scale(0);
            animation: none
        }
        .smoke {
            position: absolute;
            left: 50%;
            bottom: 46px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(225,225,240,.65);
            filter: blur(5px);
            animation: sm 2.6s ease-out forwards
        }
        @keyframes sm {
            to {
                transform: translate3d(16px,-100px,0) scale(5);
                opacity: 0
            }
        }
        .tier {
            position: relative;
            margin: 0 auto;
            border-radius: 16px 16px 12px 12px;
            box-shadow: inset 0 -14px 20px rgba(0,0,0,.28),inset 0 8px 12px rgba(255,255,255,.3)
        }
        .top-t {
            width: 150px;
            height: 66px;
            background: linear-gradient(#fff4ea,#f1cdb8)
        }
        .bot-t {
            width: 250px;
            height: 92px;
            margin-top: -4px;
            background: linear-gradient(#8a5640,#4b2417)
        }
        .top-t:before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -3px;
            height: 34px;
            border-radius: 16px 16px 0 0;
            background: radial-gradient(circle at 10px 0,#5a2e1c 11px,transparent 12px) 0 0/24px 36px repeat-x,radial-gradient(circle at 22px 0,#5a2e1c 7px,transparent 8px) 0 0/44px 28px repeat-x,linear-gradient(#5a2e1c,#5a2e1c) 0 0/100% 10px no-repeat
        }
        .bot-t:before {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            top: -3px;
            height: 36px;
            border-radius: 16px 16px 0 0;
            background: radial-gradient(circle at 12px 0,#fff4ea 13px,transparent 14px) 0 0/28px 38px repeat-x,radial-gradient(circle at 26px 0,#fff4ea 8px,transparent 9px) 0 0/50px 30px repeat-x,linear-gradient(#fff4ea,#fff4ea) 0 0/100% 10px no-repeat
        }
        .bot-t:after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            bottom: 22px;
            height: 6px;
            background: linear-gradient(90deg,#b98a2f,#ffe9a8,#b98a2f)
        }
        .berry {
            position: absolute;
            font-size: 22px;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,.45));
            z-index: 5
        }
        .plate {
            width: 300px;
            height: 24px;
            margin: -5px -25px 0;
            border-radius: 50%;
            background: radial-gradient(ellipse at 50% 30%,#fff,#d9dcec 60%,#8e93b0);
            box-shadow: 0 0 0 3px #e3c36e
        }

        /* balloons */
        .b {
            position: absolute;
            bottom: -190px;
            pointer-events: auto;
            cursor: pointer;
            animation: rs linear infinite;
            will-change: transform
        }
        @keyframes rs {
            to {
                transform: translate3d(0,-135vh,0)
            }
        }
        .bb {
            position: relative;
            width: var(--w);
            height: calc(var(--w)*1.22);
            border-radius: 50% 50% 48% 48%/56% 56% 44% 44%;
            background: radial-gradient(circle at 30% 22%,rgba(255,255,255,.95) 0,transparent 20%),radial-gradient(circle at 38% 32%,var(--c1),var(--c2) 68%,var(--c3));
            box-shadow: inset -10px -14px 22px rgba(0,0,0,.3),inset 6px 6px 14px rgba(255,255,255,.28),0 10px 20px rgba(0,0,0,.28);
            transform-origin: 50% 130%;
            animation: sw 4.5s ease-in-out infinite alternate;
            transition: transform .3s var(--ease),opacity .3s
        }
        .bb:before {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -9px;
            width: 12px;
            height: 12px;
            background: var(--c2);
            transform: translateX(-50%) rotate(45deg);
            border-radius: 2px 2px 6px 2px
        }
        .bb:after {
            content: "";
            position: absolute;
            left: 50%;
            top: 100%;
            width: 1.5px;
            height: 90px;
            background: linear-gradient(rgba(255,255,255,.75),transparent)
        }
        @keyframes sw {
            from {
                transform: rotate(-6deg)
            }
            to {
                transform: rotate(6deg)
            }
        }
        .b.pop .bb {
            transform: scale(1.7);
            opacity: 0
        }

        /* page 2 */
        .wrap {
            position: relative;
            z-index: 3;
            max-width: 560px;
            margin: 0 auto;
            padding: 0 18px calc(env(safe-area-inset-bottom,0px) + 90px)
        }
        .hero {
            text-align: center;
            padding-top: 80px
        }
        .pwrap {
            position: relative;
            width: min(70vw,270px);
            aspect-ratio: .82;
            margin: 34px auto 8px;
            will-change: transform
        }
        .pwrap:before {
            content: "";
            position: absolute;
            inset: -14px;
            border-radius: 200px 200px 34px 34px;
            background: conic-gradient(from 0deg,var(--gold),var(--pink),var(--teal),#9b7cff,var(--gold));
            animation: sp 8s linear infinite;
            box-shadow: 0 0 50px rgba(247,215,148,.35)
        }
        @keyframes sp {
            to {
                filter: hue-rotate(360deg)
            }
        }
        .pwrap .ph {
            position: absolute;
            inset: 0;
            border-radius: 190px 190px 26px 26px;
            overflow: hidden;
            cursor: default;
            background: linear-gradient(160deg,#3b2b7a,#b44a8b,#ffb08a);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            animation: lq 10s ease-in-out infinite
        }
        @keyframes lq {
            50% {
                border-radius: 170px 210px 30px 22px/200px 170px 24px 30px
            }
        }
        .ph img,.ig img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block
        }
        .tag {
            display: inline-block;
            margin-top: 18px;
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid var(--line);
            background: rgba(70,45,120,.6);
            font-size: 14px
        }
        .sec {
            margin-top: 70px;
            text-align: center
        }
        .sec h2 {
            font-family: 'Playfair Display',Georgia,serif;
            font-style: italic;
            font-weight: 600;
            font-size: 30px;
            color: var(--gold);
            margin-bottom: 22px
        }
        .msg {
            position: relative;
            background: linear-gradient(135deg,rgba(88,62,150,.62),rgba(45,28,90,.6));
            border: 1px solid var(--line);
            border-radius: 32px 18px 32px 18px;
            padding: 24px 22px 22px;
            margin: 18px 0;
            text-align: left;
            line-height: 1.7;
            font-size: 16px;
            box-shadow: 0 18px 40px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.35);
            opacity: 0;
            transform: translate3d(-60px,30px,0) scale(.95);
            transition: opacity 1.1s var(--ease),transform 1.1s var(--ease)
        }
        .msg:nth-child(even) {
            border-radius: 18px 32px 18px 32px;
            transform: translate3d(60px,30px,0) scale(.95)
        }
        .msg.in {
            opacity: 1;
            transform: none
        }
        .msg em {
            display: block;
            font-style: normal;
            font-size: 30px;
            margin-bottom: 6px;
            filter: drop-shadow(0 3px 5px rgba(0,0,0,.4))
        }
        .msg h3 {
            font-family: 'Playfair Display',Georgia,serif;
            font-style: italic;
            font-weight: 600;
            font-size: 21px;
            color: var(--gold);
            margin-bottom: 6px
        }
        #veil {
            position: fixed;
            inset: 0;
            z-index: 70;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle,#4b1c82,#150b33 65%,#0b0820);
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.4s var(--ease);
            text-align: center;
            overflow: hidden
        }
        #veil.on {
            opacity: 1
        }
        .raysw {
            position: absolute;
            inset: 0;
            -webkit-mask-image: radial-gradient(circle,#000 0,transparent 60%);
            mask-image: radial-gradient(circle,#000 0,transparent 60%)
        }
        .rays {
            position: absolute;
            width: 130vmax;
            height: 130vmax;
            left: 50%;
            top: 50%;
            margin: -65vmax 0 0 -65vmax;
            background: repeating-conic-gradient(rgba(247,215,148,.18) 0 6deg,transparent 6deg 18deg);
            animation: rot 30s linear infinite;
            will-change: transform
        }
        @keyframes rot {
            to {
                transform: rotate(360deg)
            }
        }
        .vt {
            position: relative;
            font-family: 'Playfair Display',Georgia,serif;
            font-style: italic;
            font-size: clamp(22px,6vw,32px);
            color: var(--gold);
            line-height: 1.5;
            padding: 0 20px
        }
        .vt span {
            display: block;
            opacity: 0;
            transform: translate3d(0,26px,0)
        }
        #veil.on .vt span {
            animation: vin 1.5s var(--ease) forwards
        }
        #veil.on .vt span:nth-child(1) {
            animation-delay: .5s
        }
        #veil.on .vt span:nth-child(2) {
            animation-delay: 1.1s
        }
        #veil.on .vt span:nth-child(3) {
            animation-delay: 1.7s
        }
        @keyframes vin {
            to {
                opacity: 1;
                transform: none
            }
        }
        .vt .big {
            font-size: clamp(40px,13vw,68px);
            background: linear-gradient(100deg,#fff,var(--gold),var(--rose));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }
        .ring {
            position: fixed;
            left: 50%;
            top: 62%;
            width: 140vmax;
            height: 140vmax;
            margin: -70vmax;
            border-radius: 50%;
            background: radial-gradient(circle,transparent 60%,rgba(247,215,148,.85) 64%,rgba(255,111,168,.35) 68%,transparent 74%);
            z-index: 75;
            pointer-events: none;
            animation: ring 2s cubic-bezier(.7,0,.2,1) forwards;
            will-change: transform
        }
        @keyframes ring {
            from {
                transform: scale(0)
            }
            to {
                transform: scale(1);
                opacity: .2
            }
        }
        #p2 {
            will-change: opacity,transform
        }
        #p2.pre {
            opacity: 0;
            transform: scale(1.06)
        }
        #p2.show {
            opacity: 1;
            transform: none;
            transition: opacity 1.5s cubic-bezier(.4,0,.2,1),transform 2s var(--ease)
        }
        .pre .rvx {
            opacity: 0
        }
        .enter .rvx {
            animation: rvx 1.7s var(--ease) both;
            animation-delay: var(--d,0s)
        }
        @keyframes rvx {
            from {
                opacity: 0;
                transform: translate3d(0,46px,0) scale(.86)
            }
            to {
                opacity: 1;
                transform: none
            }
        }
        .gifts {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap
        }
        .gift {
            position: relative;
            width: 29%;
            min-width: 96px;
            padding-top: 70px;
            cursor: pointer;
            transition: margin .8s var(--ease)
        }
        .gift.open {
            margin-bottom: 80px
        }
        .glow {
            position: absolute;
            left: 50%;
            top: 10px;
            width: 230%;
            aspect-ratio: 1;
            transform: translate(-50%,0) scale(0);
            background: conic-gradient(from 0deg,transparent,rgba(247,215,148,.45),transparent 25%,rgba(255,111,168,.4),transparent 55%,rgba(39,211,192,.4),transparent 80%);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 1s,transform 1.2s var(--ease);
            pointer-events: none;
            -webkit-mask-image: radial-gradient(circle,#000 20%,transparent 65%);
            mask-image: radial-gradient(circle,#000 20%,transparent 65%)
        }
        .gift.open .glow {
            opacity: 1;
            transform: translate(-50%,-10%) scale(1);
            animation: sp2 10s linear infinite
        }
        @keyframes sp2 {
            to {
                rotate: 360deg
            }
        }
        .gbox {
            position: relative;
            aspect-ratio: 1.1;
            border-radius: 6px 6px 12px 12px;
            background: linear-gradient(135deg,var(--g1),var(--g2));
            box-shadow: inset -8px -10px 16px rgba(0,0,0,.28),inset 4px 4px 10px rgba(255,255,255,.35),0 16px 24px rgba(0,0,0,.45);
            animation: wb 3s ease-in-out infinite;
            will-change: transform
        }
        .gift:nth-child(2) .gbox {
            animation-delay: -1s
        }
        .gift:nth-child(3) .gbox {
            animation-delay: -2s
        }
        @keyframes wb {
            0%,78%,100% {
                transform: rotate(0)
            }
            84% {
                transform: rotate(-5deg)
            }
            90% {
                transform: rotate(5deg)
            }
            95% {
                transform: rotate(-2deg)
            }
        }
        .gbox:before,.lid:before {
            content: "";
            position: absolute;
            left: 43%;
            width: 14%;
            top: 0;
            bottom: 0;
            background: linear-gradient(90deg,#f1c85a,#fff0b0,#f1c85a)
        }
        .lid {
            position: absolute;
            left: -6%;
            right: -6%;
            top: -24%;
            height: 30%;
            border-radius: 8px;
            background: linear-gradient(135deg,var(--g1),var(--g2));
            box-shadow: inset 0 -5px 8px rgba(0,0,0,.25),0 6px 10px rgba(0,0,0,.3);
            transition: transform 1s var(--ease),opacity .8s .15s
        }
        .lid:after {
            content: "🎀";
            position: absolute;
            left: 50%;
            top: -34px;
            transform: translateX(-50%);
            font-size: 34px;
            filter: drop-shadow(0 3px 4px rgba(0,0,0,.45))
        }
        .gift.open .lid {
            transform: translate3d(50px,-110px,0) rotate(40deg);
            opacity: 0
        }
        .gift.open .gbox {
            animation: none
        }
        .pol {
            position: absolute;
            left: 50%;
            top: 62px;
            width: 120%;
            aspect-ratio: .86;
            background: #fffaf3;
            padding: 7px 7px 24px;
            border-radius: 5px;
            color: #3a2a30;
            font-size: 12px;
            font-weight: 500;
            box-shadow: 0 18px 34px rgba(0,0,0,.55);
            transform: translate3d(-50%,40px,0) scale(.2) rotate(-8deg);
            opacity: 0;
            transition: transform 1.2s var(--ease),opacity .6s;
            z-index: 5;
            pointer-events: none
        }
        .pol .ig {
            height: 80%;
            border-radius: 3px;
            background: linear-gradient(135deg,#ffd1ec,#c9a0ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            overflow: hidden
        }
        .pol p {
            margin-top: 5px
        }
        .gift.open .pol {
            transform: translate3d(-50%,-96px,0) scale(1) rotate(2deg);
            opacity: 1;
            pointer-events: auto
        }
        .final {
            margin-top: 70px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px
        }
        .mus {
            position: fixed;
            right: 14px;
            bottom: calc(env(safe-area-inset-bottom,0px) + 16px);
            z-index: 40;
            display: none;
            align-items: center;
            gap: 8px
        }
        .eq {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            height: 14px
        }
        .eq i {
            width: 3px;
            background: var(--gold);
            border-radius: 2px;
            height: 100%;
            transform-origin: bottom;
            animation: eq .9s ease-in-out infinite
        }
        .eq i:nth-child(2) {
            animation-delay: -.3s
        }
        .eq i:nth-child(3) {
            animation-delay: -.6s
        }
        .paused .eq i {
            animation-play-state: paused;
            transform: scaleY(.3)
        }
        @keyframes eq {
            50% {
                transform: scaleY(.25)
            }
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translate3d(-50%,30px,0);
            background: rgba(0,0,0,.72);
            padding: 10px 18px;
            border-radius: 30px;
            font-size: 13px;
            opacity: 0;
            transition: .5s var(--ease);
            z-index: 90
        }
        .toast.on {
            opacity: 1;
            transform: translate3d(-50%,0,0)
        }
        #p1.go .stage {
            transition: transform 1.8s var(--ease),opacity 1.6s;
            transform: scale(1.12);
            opacity: .0
        }
        .rvx {
            opacity: 0;
            transform: translate3d(0,26px,0);
            animation: rvv 1.2s var(--ease) forwards
        }
        @keyframes rvv {
            to {
                opacity: 1;
                transform: none
            }
        }
        @media (prefers-reduced-motion:reduce) {
            * {
                animation-duration: .01ms!important;
                animation-iteration-count: 1!important;
                transition-duration: .01ms!important
            }
        }
    </style>
</head>

<body>

    <canvas id="fx"></canvas>

    <audio id="song" loop></audio>

    <div class="page" id="p1">

        <div class="aurora">
            <i></i><i></i><i></i>

    <div class="page" id="p2">

        <div class="aurora">
            <i></i><i></i><i></i>
        </div>

        <div class="stars" id="st2"></div>
        <div class="sky" id="sky2"></div>

        <div class="wrap">

            <div class="hero">

                <h1 class="ttl rvx" style="--d:.1s">
                    <small>Happy Birthday</small>
                    <span class="nm" id="nm2"></span> 🎂
                </h1>

                <!-- PHOTO SPACE -->
                <div class="rvx" style="--d:.55s">

                    <div class="pwrap" id="pw">

                        <div class="ph" id="ph">

                            <!-- Apni photo yaha CONFIG.photo se add karo -->

                            <span style="font-size:44px">📸</span>

                        </div>

                    </div>

                </div>

                <span class="tag rvx" style="--d:1.1s">

            </div>


            <div class="sec">

                <h2>Dil se kuch baatein</h2>

            <div class="sec">

                </button>

                <button class="cta" id="more">

            <span class="eq">
                <i></i><i></i><i></i>
            </span>

        </button>

    </div>


    <div class="toast" id="toast"></div>


    <div id="veil">

        <div class="raysw">
            <div class="rays"></div>
        </div>

        <p class="vt">
            <span>Ek chhota sa surprise…</span>
            <span>sirf tere liye 💫</span>
            <span class="big" id="vname"></span>
        </p>

    </div>


    <script>

        /* ===== YAHA SETTINGS BADLO ===== */

        var CONFIG = {

            name: "Bidusmita",

            from: "Tera best friend 💝",

            /*
      SONG:
      Apni song file ka naam yaha likho.

      Example:
      song: "birthday.mp3"
    */
            song: "Bidu.mp3",

            /*
      PHOTO:
      Apni photo file ka naam yaha likho.

      Example:
      photo: "bidusmita.jpg"
    */
            photo: "Bidusmita.png",

            /*
      GIFT PHOTOS:
      Agar gift box ke andar photos lagani hain
      to yaha file names daal sakte ho.
    */
            giftPhotos: [
                "",
                "",
                ""
            ]

        };


        /* ================================ */

        var MSGS = [

    [
        "🎂",
        "Happy Birthday, " + CONFIG.name + "!",
        "Aaj ka din sirf tera hai. Dil se dua hai ki teri zindagi hamesha khushiyon, pyaari si smiles aur beautiful moments se bhari rahe. Jo bhi tu chahe, woh tujhe mile, aur har naya saal tere liye aur bhi special ho. Aaj bas enjoy kar, smile kar aur apna special day dil kholkar celebrate kar. 💖✨"
    ],

    [
        "😊",
        "Teri Smile",
        "Teri smile mein pata nahi kya magic hai, lekin jab tu hasti hai na, toh aas-paas ka mahaul bhi automatically achha lagne lagta hai. Bas meri ek wish hai—chahe life mein kuch bhi ho, tere chehre ki ye smile kabhi kam na ho. Hamesha aise hi haste reh, khush reh aur apni beautiful si smile sabko dete reh. 🥰🌸"
    ],

    [
        "🤝",
        "Meri Favourite Person",
        "Duniya mein bahut log milte hain, lekin kuch log life mein itne special ban jaate hain ki unki jagah koi aur nahi le sakta. Tu unhi special logon mein se ek hai. Teri dosti mere liye bahut precious hai. Tera samajhna, care karna, bina bole feelings samajh jaana aur har situation mein saath dena—ye sab mere liye bahut matter karta hai. Thank you for being such an amazing friend. 💕🤝"
    ],

    [
        "🌈",
        "Hamari Yaadein",
        "Hamari woh random conversations, bina wajah ki hasi, chhoti-chhoti nok-jhok, endless talks aur saath mein bitaye hue moments—shayad yehi sab kal sabse beautiful memories banenge. Abhi toh bahut saari yaadein banana baaki hain. Bas aise hi dosti, hasi-mazaak aur pagalpan ke saath aur bahut saare beautiful moments create karne hain. 🥹💫"
    ],

    [
        "✨",
        "Meri Dua",
        "Meri dil se dua hai ki teri life mein hamesha happiness rahe. Tere saare dreams poore hon, tujhe har woh cheez mile jo tu deserve karti hai, aur tere raaste mein aane wali har mushkil aasaan ho jaaye. Tu hamesha khush rahe, confidence ke saath aage badhe aur apni life mein bahut kuch achieve kare. Aur haan, chahe life kitni bhi busy ho jaaye, hamari dosti aur ye beautiful bond hamesha aise hi bana rahe. ❤️✨"
    ]

];

        var GIFTS = [
            ["#ff7aa8", "#c2185b", "🧸", "Teddy Hug"],
            ["#7f9bff", "#3949ab", "🌹", "Gulab tere liye"],
            ["#ffbd5c", "#d35400", "🍫", "Sweet Surprise"]
        ];


        var $ = function(s) {
            return document.querySelector(s)
        },

        audio = $("#song");


        function toast(t) {

            var e = $("#toast");

            e.textContent = t;

            e.classList.add("on");

            setTimeout(function() {
                e.classList.remove("on")
            }, 2200)

        }


        /* NAME */

        ["#nm1", "#nm2"].forEach(function(id) {

            $(id).innerHTML = CONFIG.name.split("").map(function(c, i) {

                return '<span style="animation-delay:'+(i*.13)+'s">'+c+'</span>'

            }).join("")

        });


        /* STARS */

        ["#st1", "#st2"].forEach(function(id) {

            var h = "";

            for (var i = 0; i < 22; i++) {

                var s = 1+Math.random()*2.5;

                h += '<b style="left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+s+'px;height:'+s+'px;animation-delay:-'+Math.random()*4+'s"></b>'

            }

            $(id).innerHTML = h

        });


        /* CANDLES */

        for (var i = 0; i < 5; i++) {

            var c = document.createElement("div");

            c.className = "candle";

            c.innerHTML = '<div class="flame"></div>';

            $("#candles").appendChild(c)

        }


        /* PHOTO */

        function setPhoto(u) {

            $("#ph").innerHTML =
            '<img src="'+u+'" alt="'+CONFIG.name+'">'

        }

        if (CONFIG.photo) {

            setPhoto(CONFIG.photo)

        }


        /* SONG */

        if (CONFIG.song) {

            audio.src = CONFIG.song

        }


/* MUSIC */

function playMusic() {
    if (audio.src && audio.paused) {
        audio.play().catch(function () {});
    }
}

function pauseMusic() {
    if (audio.src && !audio.paused) {
        audio.pause();
    }
}

/* Music button */
$("#mus").onclick = function() {

    if (!audio.src) {
        toast("🎵 CONFIG.song me song ka naam add karo");
        return;
    }

    if (audio.paused) {
        audio.play().catch(function () {});
        this.classList.remove("paused");
    } else {
        audio.pause();
        this.classList.add("paused");
    }
};

/*
   Browser/app background me jaate hi
   song pause hoga.
*/
document.addEventListener("visibilitychange", function () {

    if (document.hidden) {

        pauseMusic();

    } else {

        /*
          Browser me wapas aane par
          song automatically resume hoga.
        */
        playMusic();

    }

});


        /* canvas: confetti + sparkle trail */

        var cv = $("#fx"),
        cx = cv.getContext("2d"),
        P = [],
        run = false,
        last = 0,
        dpr = Math.min(devicePixelRatio || 1, 1.5);


        function rs() {

            cv.width = innerWidth*dpr;

            cv.height = innerHeight*dpr;

            cx.setTransform(dpr, 0, 0, dpr, 0, 0)

        }

        rs();

        addEventListener("resize", rs);


        var COL = [
            "#ff6fa8",
            "#f7d794",
            "#27d3c0",
            "#c9a0ff",
            "#fff",
            "#f4b8a6",
            "#7dffb0"
        ];


        function burst(x, y, n, pw) {

            for (var i = 0; i < n; i++) {

                var a = Math.random()*6.283,
                v = (pw || 9)*Math.random()+2;

                P.push({
                    x: x,
                    y: y,
                    vx: Math.cos(a)*v,
                    vy: Math.sin(a)*v-5,
                    r: Math.random()*6,
                    vr: Math.random()*.3-.15,
                    s: 5+Math.random()*7,
                    c: COL[Math.random()*COL.length|0],
                    l: 1,
                    sp: Math.random() < .3
                })

            }

            if (P.length > 240)
                P.splice(0, P.length-240);

            kick()

        }


        function trail(x, y) {

            P.push({
                x: x,
                y: y,
                vx: Math.random()*2-1,
                vy: Math.random()*-1.2,
                r: 0,
                vr: 0,
                s: 7,
                c: "#f7d794",
                l: .7,
                sp: true,
                g: .03,
                d: .03
            })

        }


        function kick() {

            if (!run) {

                run = true;

                last = performance.now();

                requestAnimationFrame(loop)

            }

        }


        function loop(t) {

            var k = Math.min((t-last)/16.67, 3);

            last = t;

            cx.clearRect(0, 0, innerWidth, innerHeight);

            P = P.filter(function(p) {

                return p.l > 0 && p.y < innerHeight+30

            });


            P.forEach(function(p) {

                p.vy += (p.g == null ? .26: p.g)*k;

                p.vx *= Math.pow(.99, k);

                p.x += p.vx*k;

                p.y += p.vy*k;

                p.r += p.vr*k;

                p.l -= (p.d || .006)*k;

                cx.save();

                cx.globalAlpha = Math.max(p.l, 0);

                cx.translate(p.x, p.y);

                cx.rotate(p.r);

                cx.fillStyle = p.c;

                if (p.sp) {

                    cx.beginPath();

                    cx.arc(0, 0, p.s/3, 0, 6.283);

                    cx.fill();

                    cx.globalAlpha *= .25;

                    cx.beginPath();

                    cx.arc(0, 0, p.s, 0, 6.283);

                    cx.fill()

                } else {

                    cx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2)

                }

                cx.restore()

            });


            if (P.length)
                requestAnimationFrame(loop);
            else
                run = false

        }


        var lt = 0;

        addEventListener("pointermove", function(e) {

            var n = performance.now();

            if ((n-lt > 45 && e.pointerType !== "touch") || n-lt > 70) {

                lt = n;

                trail(e.clientX, e.clientY)

            }

        });


        /* BALLOONS */

        var BC = [
            ["#ffd1e3", "#ff5c9d", "#a0003f"],
            ["#c3d9ff", "#4f86ff", "#16348f"],
            ["#fff0b3", "#ffc233", "#9a6200"],
            ["#dcc8ff", "#8a55ff", "#41179a"],
            ["#b8ffe0", "#1fcf8f", "#06684a"],
            ["#ffe0d6", "#f4a28c", "#a8503a"]
        ];


        function balloon(id) {

            var c = BC[Math.random()*BC.length|0],
            e = document.createElement("div"),
            w = 44+Math.random()*34;

            e.className = "b";

            e.style.cssText =
            "left:"+Math.random()*90+"%;animation-duration:"+
            (13+Math.random()*10)+"s;animation-delay:-"+
            Math.random()*14+"s";

            e.innerHTML =
            '<div class="bb" style="--w:'+w+
            'px;--c1:'+c[0]+';--c2:'+c[1]+
            ';--c3:'+c[2]+';animation-delay:-'+
            Math.random()*4+'s"></div>';

            e.onclick = function() {

                var r = e.getBoundingClientRect();

                burst(
                    r.left+r.width/2,
                    r.top+30,
                    24,
                    6
                );

                e.classList.add("pop");

                setTimeout(function() {

                    e.remove();

                    balloon(id)

                },
                    350)

            };

            $(id).appendChild(e)

        }


        function balloons(id, n) {

            for (var i = 0; i < n; i++)
                balloon(id)

        }


        balloons("#sky1", 9);


        /* MESSAGES */

        $("#msgs").innerHTML = MSGS.map(function(m) {

            return '<div class="msg"><em>'+
            m[0]+'</em><h3>'+
            m[1]+'</h3>'+
            m[2]+'</div>'

        }).join("");


        $("#from").innerHTML =
        CONFIG.from+
        "<br><small style=\"opacity:.65\">Hamesha tere saath</small>";


        /* GIFTS */

        $("#gifts").innerHTML = GIFTS.map(function(g, i) {

            var img = CONFIG.giftPhotos[i];

            return '<div class="gift" style="--g1:'+g[0]+
            ';--g2:'+g[1]+'">'+

            '<div class="glow"></div>'+

            '<div class="pol">'+

            '<div class="ig">'+
            (img?
                '<img src="'+img+'" alt="gift">':
                g[2])+
            '</div>'+

            '<p>'+g[3]+'</p>'+

            '</div>'+

            '<div class="gbox">'+
            '<div class="lid"></div>'+
            '</div>'+

            '</div>'

        }).join("");


        document.querySelectorAll(".gift").forEach(function(g) {

            g.onclick = function(e) {

                if (g.classList.contains("open")) {

                    return

                }

                g.classList.add("open");

                var r = g.getBoundingClientRect();

                burst(
                    r.left+r.width/2,
                    r.top+70,
                    70,
                    9
                )

            }

        });


        /* MESSAGE ANIMATION */

        var io = new IntersectionObserver(function(es) {

            es.forEach(function(e) {

                if (e.isIntersecting) {

                    e.target.classList.add("in");

                    io.unobserve(e.target)

                }

            })

        }, {
            threshold: .2
        });


        document.querySelectorAll(".msg").forEach(function(m) {

            io.observe(m)

        });


        /* SURPRISE */

        $("#surprise").onclick = function() {

            var n = 0;

            var t = setInterval(function() {

                burst(
                    Math.random()*innerWidth,
                    Math.random()*innerHeight*.6,
                    70,
                    11
                );

                if (++n > 8)
                    clearInterval(t)

            },
                280)

        };


        /* MORE BALLOONS */

        $("#more").onclick = function() {

            balloons("#sky2",
                8);

            burst(
                innerWidth/2,
                innerHeight,
                60,
                13
            )

        };


        /* PHOTO PARALLAX */

        var tx = 0,
        ty = 0,
        cxp = 0,
        cyp = 0,
        pw = $("#pw"),
        on = false;


        var pr = false;

        addEventListener("pointermove", function(e) {

            tx = (e.clientX/innerWidth-.5)*16;

            ty = (e.clientY/innerHeight-.5)*12;

            if (on&&!pr) {

                pr = true;

                requestAnimationFrame(par)

            }

        });


        function par() {

            cxp += (tx-cxp)*.08;

            cyp += (ty-cyp)*.08;

            pw.style.transform =
            "translate3d("+cxp+"px,"+
            cyp+"px,0) rotateY("+cxp*.6+"deg)";

            if (
                Math.abs(tx-cxp)+
                Math.abs(ty-cyp) > .05
            )
                requestAnimationFrame(par);
            else
                pr = false

        }


        /* CAKE -> PAGE 2 */

        var blown = false;

        $("#cake").onclick = function() {

            if (blown)
                return;

            blown = true;

            var ck = $("#cake");

            ck.classList.add("out");


            document.querySelectorAll(".candle").forEach(function(c) {

                var s = document.createElement("span");

                s.className = "smoke";

                c.appendChild(s)

            });


            $("#hint").textContent =
            "🎉 Wish poori ho! 🎉";


            if (audio.src)
                audio.play().catch(function() {});


            var r = ck.getBoundingClientRect();

            burst(
                r.left+r.width/2,
                r.top+30,
                130,
                12
            );


            setTimeout(function() {

                burst(
                    innerWidth*.15,
                    innerHeight*.5,
                    70,
                    11
                );

                burst(
                    innerWidth*.85,
                    innerHeight*.5,
                    70,
                    11
                )

            }, 450);


            document.body.style.overflow = "hidden";


            setTimeout(function() {

                $("#p1").classList.add("go");

                $("#veil").classList.add("on");

                $("#vname").textContent =
                CONFIG.name;


                setTimeout(function() {

                    var p = $("#p2");

                    scrollTo(0, 0);

                    p.classList.add("pre");

                    p.style.display = "block";

                    balloons("#sky2", 7);

                    $("#p1").style.display = "none"

                }, 1700)

            }, 1700);


            setTimeout(function() {

                var p = $("#p2");

                on = true;

                $("#veil").classList.remove("on");


                var rg = document.createElement("div");

                rg.className = "ring";

                document.body.appendChild(rg);


                setTimeout(function() {

                    rg.remove()

                }, 2100);


                requestAnimationFrame(function() {

                    requestAnimationFrame(function() {

                        p.classList.remove("pre");

                        p.classList.add("show", "enter");

                        burst(
                            innerWidth/2,
                            innerHeight*.5,
                            70,
                            12
                        )

                    })

                });


                setTimeout(function() {

                    burst(
                        innerWidth*.2,
                        innerHeight*.35,
                        45,
                        11
                    );

                    burst(
                        innerWidth*.8,
                        innerHeight*.35,
                        45,
                        11
                    )

                }, 1500);


                setTimeout(function() {

                    p.style.position = "relative";

                    p.style.willChange = "auto";

                    p.style.transform = "none";

                    document.body.style.overflow = "";

                    var m = $("#mus");

                    m.style.display = "flex";

                    if (!audio.src || audio.paused)
                        m.classList.add("paused")

                },
                    2600)

            }, 4600)

        };

    </script>
